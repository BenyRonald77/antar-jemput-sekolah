{% extends "base.html" %}
{% block content %}
<h2>Dashboard</h2>
<h3>Posisi Kendaraan (realtime)</h3>
<table id="pos"><thead><tr><th>Plat</th><th>Sopir</th><th>Latitude</th><th>Longitude</th><th>Waktu</th></tr></thead><tbody></tbody></table>
<h3>Absensi Hari Ini</h3>
<table id="abs"><thead><tr><th>Nama</th><th>Kelas</th><th>Mobil</th><th>Naik</th><th>Turun</th></tr></thead><tbody></tbody></table>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const p = await api("/api/posisi");
  el("pos").querySelector("tbody").innerHTML = p.map(x =>
    `<tr><td><b>${x.plat}</b></td><td>${x.sopir}</td>
     <td>${x.lat ?? "-"}</td><td>${x.lng ?? "-"}</td><td>${x.waktu ?? "-"}</td></tr>`).join("");
  const a = await api("/api/absen");
  el("abs").querySelector("tbody").innerHTML = a.map(x =>
    `<tr><td>${x.nama}</td><td>${x.kelas}</td><td>${x.plat || "-"}</td>
     <td>${x.jam_naik || "-"}</td><td>${x.jam_turun || "-"}</td></tr>`).join("")
    || '<tr><td colspan="5">Belum ada absensi hari ini.</td></tr>';
}
load();
setInterval(load, 15000);
</script>
{% endblock %}
