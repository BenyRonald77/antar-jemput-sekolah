{% extends "base.html" %}
{% block content %}
<h2>Mobil</h2>
<table id="mob"><thead><tr><th>Plat</th><th>Sopir</th><th>Kapasitas</th></tr></thead><tbody></tbody></table>
<form id="fm"><input name="plat" placeholder="Plat nomor" required><input name="sopir" placeholder="Sopir" required><input name="kapasitas" type="number" min="1" placeholder="Kapasitas" required><button>Tambah Mobil</button></form>
<h2>Rute & Titik Penjemputan</h2>
<table id="rut"><thead><tr><th>Rute</th><th>Mobil</th><th>Titik (urutan · jam)</th></tr></thead><tbody></tbody></table>
<form id="fr"><select name="mobil_id" id="sm" required></select><input name="nama" placeholder="Nama rute" required><button>Tambah Rute</button></form>
<form id="ft"><select name="rute_id" id="sr" required></select><input name="urutan" type="number" min="1" placeholder="Urutan" required><input name="nama" placeholder="Nama titik" required><input name="jam" type="time" required><button>Tambah Titik</button></form>
<h3>Lapor Posisi Kendaraan</h3>
<form id="fp"><select name="mobil_id" id="spm" required></select><input name="lat" type="number" step="any" placeholder="Latitude" required><input name="lng" type="number" step="any" placeholder="Longitude" required><button>Kirim Posisi</button></form>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const m = await api("/api/mobil");
  el("sm").innerHTML = el("spm").innerHTML = m.map(x => `<option value="${x.id}">${x.plat} — ${x.sopir}</option>`).join("");
  el("mob").querySelector("tbody").innerHTML = m.map(x => `<tr><td>${x.plat}</td><td>${x.sopir}</td><td>${x.kapasitas}</td></tr>`).join("");
  const r = await api("/api/rute");
  el("sr").innerHTML = r.map(x => `<option value="${x.id}">${x.nama}</option>`).join("");
  const t = await api("/api/titik");
  el("rut").querySelector("tbody").innerHTML = r.map(x => {
    const tt = t.filter(y => y.rute_id === x.id);
    return `<tr><td><b>${x.nama}</b></td><td>${x.plat}</td>
      <td><ol>${tt.map(y => `<li>${y.nama} · ${y.jam}</li>`).join("")}</ol></td></tr>`;
  }).join("");
}
el("fm").onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); d.kapasitas = +d.kapasitas; const r = await post("/api/mobil", d); if (!r.error) { e.target.reset(); load(); } };
el("fr").onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); d.mobil_id = +d.mobil_id; const r = await post("/api/rute", d); if (!r.error) { e.target.reset(); load(); } };
el("ft").onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); d.rute_id = +d.rute_id; d.urutan = +d.urutan; const r = await post("/api/titik", d); if (!r.error) { e.target.reset(); load(); } };
el("fp").onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); d.mobil_id = +d.mobil_id; d.lat = +d.lat; d.lng = +d.lng; const r = await post("/api/posisi", d); if (!r.error) alert("Posisi terkirim " + r.waktu); };
load();
</script>
{% endblock %}
